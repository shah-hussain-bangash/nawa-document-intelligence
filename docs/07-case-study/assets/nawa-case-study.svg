<line x1="56" y1="263" x2="1384" y2="263" stroke="#37545d"/>
<text x="56" y="307" class="label">RUNNABLE QUOTATION AND REVIEW PATH</text>
<rect x="56" y="335" width="280" height="132" rx="14" class="node"/>
<text x="78" y="375" class="title">01  Bilingual input</text>
<text x="78" y="411" class="body">Arabic / English text and PDFs</text>
<text x="78" y="439" class="body">Explicit OCR in separate CLI</text>
<path d="M341 400H391" class="line"/>
<rect x="398" y="335" width="280" height="132" rx="14" class="node"/>
<text x="420" y="375" class="title">02  Field evidence</text>
<text x="420" y="411" class="body">Raw text and normalized values</text>
<text x="420" y="439" class="body">Page / line / extraction method</text>
<path d="M683 400H733" class="line"/>
<rect x="740" y="335" width="280" height="132" rx="14" class="node"/>
<text x="762" y="375" class="title">03  Financial checks</text>
<text x="762" y="411" class="body">Decimal VAT and total checks</text>
<text x="762" y="439" class="body">Rank valid AED totals only</text>
<path d="M1025 400H1075" class="line"/>
<rect x="1082" y="335" width="302" height="132" rx="14" fill="#354737" stroke="#8d9469" stroke-width="1.5"/>
<text x="1104" y="375" class="title">04  Human review</text>
<text x="1104" y="411" class="body">Corrections and decision reasons</text>
<text x="1104" y="439" class="body">Expected-revision checks</text>
<rect x="56" y="491" width="1328" height="89" rx="12" fill="#0c2937" stroke="#375b65"/>
<text x="80" y="525" fill="#b3e3d8" font-size="19" font-weight="600">SEPARATE RETRIEVAL EXPERIMENT</text>
<text x="80" y="555" class="body">Scoped BM25 → extractive eligibility → mock or opt-in provider → exact-quote / token validation</text>
<text x="56" y="631" class="label">HOSTED CI BASELINE · 16 NOVEMBER 2026 · 823565f</text>
<rect x="56" y="654" width="422" height="130" rx="14" fill="#173947"/>
<text x="80" y="706" fill="#eff8f5" font-size="40" font-weight="700">120 passed</text>
<text x="80" y="747" class="body">General job: 122 run, 2 skipped</text>
<rect x="509" y="654" width="422" height="130" rx="14" fill="#173947"/>
<text x="533" y="706" fill="#eff8f5" font-size="40" font-weight="700">2 PostgreSQL tests</text>
<text x="533" y="747" class="body">Passed in a separate configured job</text>
<rect x="962" y="654" width="422" height="130" rx="14" fill="#173947"/>
<text x="986" y="706" fill="#eff8f5" font-size="40" font-weight="700">Docker smoke</text>
<text x="986" y="747" class="body">Passed · image and local HTTP checks</text>
<text x="56" y="830" fill="#e4cc9d" font-size="18" font-weight="600">LOCAL REPLAY · 21 NOVEMBER: 11/11 scripted evaluation expectations matched.</text>
<text x="56" y="863" class="small">Citation token checks do not prove semantic correctness. Representative Arabic OCR and live-model quality remain open.</text>
<text x="56" y="896" class="small">Enterprise identity, document lifecycle and cloud acceptance require further implementation and verification.</text>
<text x="1384" y="921" text-anchor="end" fill="#9dbbbf" font-size="15">SHAH HUSSAIN BANGASH</text>
