<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">NAWA bilingual document intelligence case study</title>
<desc id="desc">Quotation evidence flows through bilingual extraction, decimal financial checks and revision-checked human review. Separate experiments demonstrate BM25 and citation validation. Hosted CI recorded 120 completed tests and two skips in the general job, two PostgreSQL tests passed separately, and a successful Docker smoke. A local replay matched eleven scripted evaluation expectations. This is a synthetic development application.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071e2b"/><stop offset="1" stop-color="#153b45"/></linearGradient>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#73b6b4" stroke-width="1.5"/></marker>
 <style>text{font-family:Segoe UI,Arial,sans-serif}.label{fill:#89b6bc;font-size:16px;font-weight:600;letter-spacing:2px}.body{fill:#bfd2d7;font-size:18px}.node{fill:#143644;stroke:#3d6470;stroke-width:1.5}.title{fill:#f0f7f5;font-weight:600;font-size:23px}.small{fill:#adc6cd;font-size:16px}.line{fill:none;stroke:#73b6b4;stroke-width:2;marker-end:url(#arrow)}</style>
</defs>
<rect width="1440" height="940" rx="24" fill="url(#bg)"/>
