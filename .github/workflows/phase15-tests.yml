name: NAWA Phase 15 synthetic OCR metric checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-ocr-metrics:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image test dependency
        run: python -m pip install Pillow==11.3.0 PyMuPDF==1.28.2
      - name: Test OCR metrics and local prototype
        working-directory: experiments/phase15
        run: python -m unittest -v test_ocr_benchmark test_rtl_field_experiment test_bounded_ocr_prototype test_additional_samples

