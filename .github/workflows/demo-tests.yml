name: NAWA synthetic demo tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF extraction dependency
        run: python -m pip install -r demo/requirements-pdf.txt
      - name: Test synthetic quotation and PDF extraction demos
        run: |
          cd demo
          python -m unittest discover -s tests -v
