name: NAWA synthetic demo tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and optional OCR dependencies
        run: |
          python -m pip install -r demo/requirements-pdf.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - name: Test synthetic quotation, PDF and OCR demos
        run: |
          cd demo
          python -m unittest discover -s tests -v
