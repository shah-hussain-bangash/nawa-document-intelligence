name: NAWA synthetic demo tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and optional OCR dependencies
        run: |
          python -m pip install -r demo/requirements-pdf.txt 'PyJWT[crypto]>=2.10,<3'
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - name: Test synthetic quotation, PDF and OCR demos
        run: |
          cd demo
          python -m unittest discover -s tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nawa_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nawa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawa_test -d nawa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NAWA_TEST_POSTGRES: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: nawa_test
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_DB: nawa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r demo/requirements-pdf.txt 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.10,<3'
      - name: Test isolated PostgreSQL persistence
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_*postgres*.py' -v
