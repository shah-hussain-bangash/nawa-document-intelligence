name: NAWA synthetic demo tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and optional OCR dependencies
        run: |
          python -m pip install -r demo/requirements-pdf.txt -r demo/requirements-phase13.txt 'PyJWT[crypto]>=2.10,<3'
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - name: Test synthetic quotation, PDF and OCR demos
        run: |
          cd demo
          python -m unittest discover -s tests -v
          node tests/test_intake_ui.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nawa_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nawa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawa_test -d nawa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NAWA_TEST_POSTGRES: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: nawa_test
      POSTGRES_PASSWORD: synthetic-ci-only
      POSTGRES_DB: nawa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r demo/requirements-pdf.txt -r demo/requirements-phase13.txt 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.10,<3'
      - name: Test isolated PostgreSQL persistence
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_*postgres*.py' -v

  windows-synthetic-intake:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic intake dependency
        run: python -m pip install -r demo/requirements-phase13.txt
      - name: Verify Windows limits and synthetic document processing
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_intake_limits.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_intake_validation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_intake_worker.py' -v
          exit $LASTEXITCODE

  phase13-postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawa_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: nawa_phase13_qa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawa_test -d nawa_phase13_qa_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: synthetic-ci-only
      NAWA_PHASE13_TEST_DSN: 'host=127.0.0.1 port=5432 dbname=nawa_phase13_qa_ci user=nawa_test password=synthetic-ci-only'
      NAWA_INTAKE: synthetic
      NAWA_AUTH: oidc
      NAWA_STORAGE: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: nawa_phase13_qa_ci
      POSTGRES_USER: nawa_test
      POSTGRES_PASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r demo/requirements-pdf.txt -r demo/requirements-phase13.txt 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.10,<3'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Create isolated synthetic schema
        run: |
          for file in demo/nawa_demo/migrations/00*.sql; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U nawa_test -d nawa_phase13_qa_ci -f "$file"
          done
          cd demo
          python -m nawa_demo.intake_migrate
      - name: Test synthetic intake and recovery
        run: |
          cd demo
          python -m unittest discover -s tests -p 'test_intake_postgres.py' -v

  local-oidc-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create isolated synthetic identity fixture
        run: |
          python -m pip install 'cryptography>=42,<51'
          cd demo
          python -m nawa_demo.prepare_oidc_fixture --output ../.data/phase12-identity
      - name: Build QA image
        run: docker build -t nawa-phase12-test .
      - name: Start isolated QA services
        run: docker compose -p nawa-phase12-ci -f compose.phase12-qa.yaml up -d
      - name: Verify local synthetic Keycloak flow
        run: docker compose -p nawa-phase12-ci -f compose.phase12-qa.yaml exec -T nawa python -m nawa_demo.phase12_live_check

  phase13-local-oidc-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create separate synthetic identity fixture
        run: |
          python -m pip install 'cryptography>=42,<51'
          cd demo
          python -m nawa_demo.prepare_oidc_fixture --phase 13 --output ../.data/phase13-identity
      - name: Build synthetic Phase 13 QA image
        run: docker build -t nawa-phase13-test .
      - name: Start isolated Phase 13 QA services
        run: docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml up -d
      - name: Test synthetic Keycloak and intake flow
        run: docker compose -p nawa-phase13-ci -f compose.phase13-qa.yaml exec -T nawa python -m nawa_demo.phase13_live_check

