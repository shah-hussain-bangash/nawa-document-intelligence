name: NAWA Phase 14 synthetic experiment checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test synthetic evaluation and review boundaries
        working-directory: experiments/phase14
        run: python -m unittest -v test_benchmark test_compare_retrieval test_lifecycle_fixture test_fixture_integrity test_support_probe test_semantic_probe test_injection_probe test_review_only test_hybrid_review test_phase13_snapshot_fixture

