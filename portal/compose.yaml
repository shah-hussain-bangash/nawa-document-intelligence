name: nawa
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nawa
      POSTGRES_USER: nawa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nawa -d nawa"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    environment:
      APP_ENV: local
      AUTH_MODE: demo
      SEED_DEMO: "true"
      DATABASE_URL: postgresql+psycopg://nawa:${POSTGRES_PASSWORD}@db:5432/nawa
      DATA_DIR: /app/.data
      WEB_ORIGIN: http://localhost:8080
      MODEL_MODE: extractive
    volumes: ["evidence:/app/.data"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "python -m alembic upgrade head && python -m uvicorn uae_ai.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
  web:
    build: ./apps/web
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    restart: unless-stopped
  worker:
    extends:
      service: api
    command: ["python", "-m", "uae_ai.worker"]
    healthcheck:
      disable: true
    depends_on:
      api: {condition: service_healthy}
volumes:
  database:
  evidence:

